# CI ของ AETHER
# - test: pytest บน Windows (รวม tests/test_windows.py ที่ใช้ Win32 จริง) และ Linux
# - build-windows: build aether.exe ด้วย PyInstaller แล้วรันตัวที่ build ได้จริง
#   (--check, เปิดแอป, ปิดด้วย hotkey Ctrl+Alt+Q) และเก็บโฟลเดอร์ dist/aether เป็น artifact
name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgles2 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip show opencv-python && { echo "opencv-python must not be installed"; exit 1; } || true

      - name: Download model and fonts
        run: |
          # ชุดเสียง Kenney ต้องโหลดเองผ่านเบราว์เซอร์ จึงขาดเสมอใน CI (exit 1) — ตรวจเฉพาะไฟล์ที่จำเป็น
          python tools/download_assets.py || true
          test -f assets/models/gesture_recognizer.task
          test -f assets/fonts/Orbitron.ttf

      - name: pytest
        run: python -m pytest -ra

  build-windows:
    name: build aether.exe
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Download model and fonts
        shell: bash
        run: |
          python tools/download_assets.py || true
          test -f assets/models/gesture_recognizer.task

      - name: Build
        shell: bash
        run: python tools/build_exe.py

      - name: Self-check of the built exe
        shell: pwsh
        env:
          AETHER_NO_DIALOG: "1"
        run: |
          $log = 'dist\aether\logs\aether.log'
          $p = Start-Process -FilePath 'dist\aether\aether.exe' -ArgumentList '--check' -Wait -PassThru
          Get-Content $log -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "aether.exe --check exited with $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'check result: OK' -Quiet)) { throw 'check result missing' }
          if (-not (Select-String -Path $log -Pattern 'UI Automation' -Quiet)) { throw 'Target Lock (UI Automation) unavailable in the build' }

      - name: Smoke run (start, then quit with Ctrl+Alt+Q)
        shell: pwsh
        env:
          AETHER_NO_DIALOG: "1"
        run: |
          $log = 'dist\aether\logs\aether.log'
          Remove-Item 'dist\aether\logs' -Recurse -Force -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath 'dist\aether\aether.exe' -ArgumentList '--dry-run' -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'DISARMED.*Ctrl\+Alt\+G' -Quiet)) { break }
            Start-Sleep -Milliseconds 500
          }
          Start-Sleep -Seconds 3
          if ($p.HasExited) { Get-Content $log -Encoding utf8; throw "aether.exe exited early with code $($p.ExitCode)" }

          # กด Ctrl+Alt+Q (hotkey ปิดแอป) ด้วย input จำลอง
          Add-Type -Namespace W -Name K -MemberDefinition '[DllImport("user32.dll")] public static extern void keybd_event(byte vk, byte scan, uint flags, System.UIntPtr extra);'
          foreach ($vk in 0x11, 0x12, 0x51) { [W.K]::keybd_event([byte]$vk, 0, 0, [UIntPtr]::Zero) }
          foreach ($vk in 0x51, 0x12, 0x11) { [W.K]::keybd_event([byte]$vk, 0, 2, [UIntPtr]::Zero) }
          $quitByHotkey = $p.WaitForExit(20000)
          if (-not $quitByHotkey) {
            Write-Host '::warning::Ctrl+Alt+Q did not close aether.exe (session may not accept injected input) - killing it'
            Stop-Process -Id $p.Id -Force
          }
          Get-Content $log -Encoding utf8
          if (Select-String -Path $log -Pattern 'CRITICAL|Traceback' -Quiet) { throw 'errors in aether.log' }
          if ($quitByHotkey -and -not (Select-String -Path $log -Pattern 'shutdown complete' -Quiet)) { throw 'no clean shutdown in aether.log' }

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: aether-windows
          path: |
            dist/aether
            !dist/aether/logs
          retention-days: 14
          if-no-files-found: error
