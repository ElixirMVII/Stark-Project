# AETHER — ค่าที่ปรับได้ทั้งหมด
# แก้ไฟล์นี้แล้วเปิดแอปใหม่ (key ที่พิมพ์ผิดจะถูกแจ้ง error ตอนเปิด ไม่ถูกข้ามเงียบๆ)

[camera]
index = 0
width = 640
height = 480
fps = 30
mirror = true               # flip แนวนอนเหมือนส่องกระจก (แนะนำให้เปิดไว้)
low_light = 40              # ภาพมืดกว่านี้ (0–255) นานเกิน 3 วินาที = HUD เตือน LOW LIGHT (0 = ปิด)
battery_fps = 15            # ตอนใช้แบตเตอรี่ ประมวลผลไม่เกินเท่านี้ fps (ประหยัดไฟ) · 0 = ไม่ลด

[tracking]
dominant_hand = "right"     # "left" | "right"
num_hands = 2
min_gesture_score = 0.6
vote_window = 5

[pointer]
active_region = [0.15, 0.10, 0.85, 0.70]   # x0, y0, x1, y1 (normalized)
one_euro = { min_cutoff = 1.0, beta = 0.02, d_cutoff = 1.0 }
pinch_lock_gain = 0.2
screens = "primary"          # "primary" = จอหลักจอเดียว | "all" = ทุกจอ (active region ยืดเต็มทุกจอ)

[pinch]
on = 0.25
off = 0.38
drag_hold_ms = 250

[scroll]
speed = 1.0
deadzone = 0.01
invert = false              # true = กลับทิศการสกรอล

[gestures]
swipe_dist_x = 0.25
swipe_dist_y = 0.20
swipe_window_ms = 300
cooldown_ms = 800
fist_hold_ms = 600
arm_hold_ms = 1000
zoom_step = 0.06
window_grab = true          # ✊ แล้วขยับ = หยิบหน้าต่างลาก/โยน (✊ นิ่งๆ = ย่อหน้าต่าง)
middle_click = true         # จีบโป้ง+นาง = คลิกปุ่มกลาง (เปิดลิงก์ในแท็บใหม่ / ปิดแท็บ)
thumb_hold_ms = 700         # 👎 ค้างนานเท่านี้ = actions.thumb_down_hold
knob = true                 # ☝️ ชี้ขึ้นค้างนิ่ง = ปุ่มหมุน (หมุนมือ = actions.knob_right / knob_left)
knob_hold_ms = 450          # ต้องนิ่งนานเท่านี้ก่อน (ชี้ขึ้นแล้วขยับ = เคอร์เซอร์ตามปกติ)
knob_step_deg = 18.0        # หมุนมือทุกกี่องศา = กดหนึ่งครั้ง

[actions]
swipe_left  = "ctrl+win+left"
swipe_right = "ctrl+win+right"
swipe_up    = "win+tab"
swipe_down  = "win+d"
fist_hold   = "minimize_foreground"
pinky_pinch = "win+shift+s"        # จีบโป้ง+ก้อย (ตัดภาพหน้าจอ)
thumb_down_hold = "media_play_pause"  # 👎 ค้าง (เล่น/หยุดเพลง)
knob_right  = "volume_up"          # ☝️ ปุ่มหมุน: หมุนตามเข็ม
knob_left   = "volume_down"        #               หมุนทวนเข็ม
# ปุ่มสื่อ/เสียงที่ใช้ได้: media_play_pause, media_next, media_prev, media_stop, volume_up, volume_down, volume_mute

[hotkeys]
toggle_arm = "<ctrl>+<alt>+g"
quit       = "<ctrl>+<alt>+q"
mark_incident = "<ctrl>+<alt>+m"   # แอปเพิ่งทำพลาด: จด 5 วินาทีที่ผ่านมาลง incidents/ (ไม่มีภาพ)

[hud]
enabled = true
opacity = 0.9
style = "minimal"          # "minimal" = เส้นบาง เรียบๆ (ค่าเริ่มต้น) | "holo" = แบบ sci-fi เรืองแสง
theme = "auto"             # "auto" (ตาม style) | "custom" (ใช้ primary/accent ข้างล่าง) | "pearl" | "aether" | "ember" | "verdant" | "violet" | "ice"
primary = "#F2F4F7"
accent  = "#D6B67A"
show_telemetry = true
show_radar = true
sounds = true
volume = 0.5
reduce_motion = false   # true = ปิด particle, การหายใจ และแอนิเมชันตอนบูต (เหลือแค่ fade)
quality = "high"        # "low" = (holo) ไม่มี glow ชั้นนอก และ particle ครึ่งเดียว (เครื่องช้า)

[launcher]
# ค้าง 👍 (Thumb_Up) เพื่อเปิดเมนูวงกลมรอบเคอร์เซอร์ → ขยับมือไปทางช่องที่ต้องการ → จีบนิ้วเพื่อเปิด
# แบมือ = ปิดเมนู  ·  run = โปรแกรม / ไฟล์ / โฟลเดอร์ / URL  ·  สูงสุด 8 รายการ (ช่องแรกอยู่บนสุด วนตามเข็ม)
enabled = true
hold_ms = 600
timeout_ms = 5000
items = [
  { label = "Browser", run = "https://www.google.com" },
  { label = "Files",   run = "explorer.exe" },
  { label = "Notepad", run = "notepad.exe" },
  { label = "Calc",    run = "calc.exe" },
]

[poses]
# ท่าที่สอนเอง: tray → "สอนท่ามือ…" (เก็บใน poses.json ข้างตัวแอป — มีแค่ตัวเลข landmark ไม่มีภาพ)
# ค้างท่าที่สอนไว้ hold_ms แล้วจะกดปุ่มลัดที่ผูกไว้ตอนสอน
enabled = true
hold_ms = 600
sensitivity = 1.0   # > 1 = รับท่าง่ายขึ้น (อาจติดเองบ่อยขึ้น), < 1 = เข้มขึ้น · ช่วง 0.25–4.0

[targeting]
# Target Lock + Magnetic Snap (Windows): HUD ล็อกกรอบรอบปุ่มใต้เคอร์เซอร์ และดูดเคอร์เซอร์เข้าหากลางปุ่ม
# (อ่านตำแหน่งปุ่มผ่าน Windows UI Automation ใน thread แยก — ปิดทั้งหมดด้วย enabled = false)
enabled = true
rate_hz = 15                # ถามหาปุ่มกี่ครั้งต่อวินาที (+ ทุกครั้งที่เคอร์เซอร์ขยับเกิน 8 px)
snap_strength = 0.6         # แรงดูด 0–1 (0 = แสดงกรอบอย่างเดียว ไม่ดูด)
escape_speed = 2.5          # ขยับมือเร็วกว่านี้ (ความกว้างจอต่อวินาที) = หลุดจากแรงดูด
max_size = [480, 160]       # logical px: ปุ่ม/รายการที่ใหญ่กว่านี้ไม่ดูด (เช่นพื้นที่ข้อความ)
show_label = true           # ป้าย "BUTTON · Save" ใต้กรอบ
app_blocklist = []          # โปรแกรมที่ไม่ต้องหาเป้า เช่น ["game.exe"]

[safety]
auto_disarm_minutes = 10   # ARMED แต่ไม่เห็นมือนานเท่านี้ = DISARM เอง (ลืมปิดแล้วลุกไป) · 0 = ปิด

[claude]
# ฟีเจอร์ที่ใช้ Claude (AI ของ Anthropic): ถามเรื่องธาตุใน Studio, ทายภาพวาด, ผู้ช่วยตั้งค่า, วิเคราะห์ log,
# ท่ามือ "ask_claude" — ต้องต่ออินเทอร์เน็ตและมี API key (ใส่ได้ที่ tray → "ผู้ช่วย Claude…") คิดเงินตามการใช้
# ไม่ส่งภาพจากกล้องเด็ดขาด · ปิดไว้ = แอปไม่ต่ออินเทอร์เน็ตเลย
enabled = false
model = "claude-opus-5-5"
effort = "low"             # low (เร็ว ประหยัด) | medium | high | xhigh | max (คิดลึก ช้า แพงขึ้น)
max_tokens = 4096
